# Fault-injection campaign of the project (see the report, Section 4).
# Edit the paths of this section for your machine.

[campaign]
root = ".."                                   # application sources are relative to the project root
work = "~/aspis-project/campaign"             # builds, golden runs, results of each group of experiments
results = "../results/fault_injection"        # metrics.csv, outcomes.csv, raw.csv.gz
aspis = "~/aspis-project/ASPIS"               # ASPIS b66a090 + the patches of aspis-integration/
llvm_bin = "~/aspis-project/toolchain/LLVM-21.1.8-Linux-X64/bin"
tmp = "/dev/shm/aspis-fi"                     # output files of the experiments
models = ["reg", "branch"]
injections = 500                              # per application x configuration x model
seed = 2026
timeout_factor = 20                           # after the fault, a run is a hang if it lasts 20 times
timeout_min_ms = 1000                         # the normal run time, and at least 1 s

# The first configuration is the reference: same pipeline, no protection.
[[config]]
name = "baseline"
flags = "--no-dup --no-cfc"

[[config]]
name = "EDDI"
flags = "--eddi --no-cfc"

[[config]]
name = "CFCSS"
flags = "--no-dup --cfcss"

[[config]]
name = "RASM"
flags = "--no-dup --rasm"

[[config]]
name = "EDDI+CFCSS"
flags = "--eddi --cfcss"

[[config]]
name = "EDDI+RASM"
flags = "--eddi --rasm"

[[application]]
name = "aes128"
source = "benchmarks/aes128.c"

[[application]]
name = "fft"
source = "benchmarks/fft.c"
flags = "-lm"

[[application]]
name = "huffman"
source = "benchmarks/huffman.c"

[[application]]
name = "pid_control"
source = "benchmarks/pid_control.c"
