# Fault-injection campaign of the project (see the report, Section 5).
# Edit the paths of this section for your machine.

[campaign]
root = ".."                                  # sources are relative to the project root
output = "~/aspis-project/campaign"          # build products, golden runs, raw results
aspis = "~/aspis-project/ASPIS"              # ASPIS master + the patches of aspis-integration/
llvm_bin = "~/aspis-project/toolchain/LLVM-21.1.8-Linux-X64/bin"
fi = "~/aspis-project/fi"                    # compiled fault_injection/injector/fi.c
tmp = "/dev/shm/aspis-fi"
models = ["reg", "branch"]
injections = 1000                            # per application x configuration x model
chunk = 100
seed = 2026
timeout_factor = 20                          # hang = 20x the normal run time ...
timeout_min_ms = 300                         # ... but at least 300 ms

# The first configuration is the reference: same pipeline, no protection.
[[config]]
name = "baseline"
flags = "--no-dup --no-cfc"

[[config]]
name = "EDDI"
flags = "--eddi --no-cfc"

[[config]]
name = "CFCSS"
flags = "--no-dup --cfcss"

[[config]]
name = "RASM"
flags = "--no-dup --rasm"

[[config]]
name = "EDDI+CFCSS"
flags = "--eddi --cfcss"

[[config]]
name = "EDDI+RASM"
flags = "--eddi --rasm"

[[application]]
name = "aes128"
source = "benchmarks/aes128.c"

[[application]]
name = "fft"
source = "benchmarks/fft.c"
flags = "-lm"

[[application]]
name = "huffman"
source = "benchmarks/huffman.c"

[[application]]
name = "pid_control"
source = "benchmarks/pid_control.c"
